  <symbol id="star-filled" viewBox="0 0 20 20">
    <polygon fill="currentColor"
      points="10,2.5 11.76,7.57 17.13,7.68 12.85,10.93 14.41,16.07 10,13 5.59,16.07 7.15,10.93 2.87,7.68 8.24,7.57"/>
