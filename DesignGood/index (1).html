<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tradeball — UI Kit</title>
<link rel="icon" href="../../assets/logo.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; background: #F9F9F9; }
  a { color: inherit; text-decoration: none; }
  /* keep React from showing button focus rings unless keyboard */
  button:focus { outline: none; }
  button:focus-visible { box-shadow: 0 0 0 3px rgba(229,53,53,.22); }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="HomePage.jsx"></script>
<script type="text/babel" src="ProductDetail.jsx"></script>
<script type="text/babel" src="SellPage.jsx"></script>
<script type="text/babel" src="FavoritesPanel.jsx"></script>
<script type="text/babel" src="Profile.jsx"></script>
<script type="text/babel" src="ProfileSections.jsx"></script>
<script type="text/babel" src="Modals.jsx"></script>

<script type="text/babel">
  const App = () => {
    const [page, setPage] = React.useState("home"); // home | product | sell | profile
    const [section, setSection] = React.useState("ventas");
    const [selected, setSelected] = React.useState(null);
    const [favOpen, setFavOpen] = React.useState(false);
    const [auth, setAuth] = React.useState(null); // login | register
    const [logout, setLogout] = React.useState(false);
    const [purchase, setPurchase] = React.useState(null);
    const [loggedIn, setLoggedIn] = React.useState(true);
    const [published, setPublished] = React.useState(false);

    const user = { initial: "M", name: "Marina", lastname: "Ruiz", email: "marina.ruiz@email.com" };

    const openProduct = (p) => { setSelected(p); setPage("product"); window.scrollTo(0,0); };
    const goSell = () => { setPublished(false); setPage("sell"); window.scrollTo(0,0); };

    return (
      <div data-screen-label={`${page}${page==="profile"?" / "+section:""}`}>
        <Header
          loggedIn={loggedIn}
          user={user}
          onNav={setPage}
          onAuth={setAuth}
          onSell={goSell}
          onFavorites={() => setFavOpen(true)}
          onLogout={() => setLogout(true)}
        />

        {page === "home" && <HomePage onOpenProduct={openProduct}/>}
        {page === "product" && selected && (
          <ProductDetail
            product={selected}
            onBack={() => setPage("home")}
            onContact={() => { setPage("profile"); setSection("chat"); }}
          />
        )}
        {page === "sell" && (
          <SellPage
            published={published}
            onPublished={() => setPublished(true)}
            onBack={() => { setPage("home"); setPublished(false); }}
          />
        )}
        {page === "profile" && (
          <ProfileShell user={user} section={section} onSection={setSection}>
            {section === "perfil"       && <SectionPerfil user={user}/>}
            {section === "ventas"       && <SectionVentas onOpenRequest={({item}) => setPurchase(item)}/>}
            {section === "compras"      && <SectionCompras/>}
            {section === "chat"         && <SectionChat/>}
            {section === "notif"        && <SectionNotif/>}
            {section === "monedero"     && <SectionMonedero/>}
            {section === "valoraciones" && <SectionValoraciones/>}
          </ProfileShell>
        )}

        <FavoritesPanel
          open={favOpen}
          onClose={() => setFavOpen(false)}
          items={loggedIn ? PRODUCTS.slice(0,4) : []}
        />
        {auth === "login" && (
          <LoginModal
            onClose={() => setAuth(null)}
            onSwitch={() => setAuth("register")}
            onSuccess={() => { setAuth(null); setLoggedIn(true); }}
          />
        )}
        {auth === "register" && (
          <RegisterModal
            onClose={() => setAuth(null)}
            onSwitch={() => setAuth("login")}
            onSuccess={() => { setAuth(null); setLoggedIn(true); }}
          />
        )}
        {logout && (
          <LogoutModal
            user={user}
            onClose={() => setLogout(false)}
            onConfirm={() => { setLogout(false); setLoggedIn(false); setPage("home"); }}
          />
        )}
        {purchase && (
          <PurchaseRequestModal item={purchase} onClose={() => setPurchase(null)}/>
        )}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
